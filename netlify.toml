# Netlify 배포 설정
# - GitHub 저장소를 Netlify에 연결하면 이 파일을 읽어서 자동으로 빌드·배포해요.
# - 백엔드 주소(VITE_API_BASE)는 비밀값은 아니지만 .env가 커밋되지 않으므로
#   Netlify 사이트 설정 → Environment variables 에 따로 넣어야 해요.

[build]
  command = "npm run build"   # Vite로 배포용 파일 만들기
  publish = "dist"            # 만들어진 파일이 들어가는 폴더

[build.environment]
  NODE_VERSION = "22"         # Vite 8은 Node 20.19 이상 또는 22.12 이상이 필요해요

  # Netlify 비밀값 검사에서 Firebase 웹 apiKey만 빼요.
  # - Firebase 웹 apiKey는 원래 브라우저에 공개되는 값이에요. (비밀번호가 아니에요)
  # - 데이터는 Firebase 보안 규칙과 백엔드의 로그인 토큰 검사로 보호돼요.
  # - 검사 기능 전체를 끄지 않고 이 값 하나만 빼서, 진짜 비밀값이 실수로 들어가면 계속 막아 줘요.
  SECRETS_SCAN_SMART_DETECTION_OMIT_VALUES = "AIzaSyDKv5yBZIfs0CCkufgIBnqnJ94vyOOaKEY"

# 서비스 워커(sw.js)와 설치 정보(manifest)는 브라우저가 오래 저장해 두면 새 버전이 늦게 반영돼요.
# 항상 새로 확인하게 해요.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
    Cache-Control = "no-cache"
