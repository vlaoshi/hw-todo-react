# Netlify 배포 설정
# - GitHub 저장소를 Netlify에 연결하면 이 파일을 읽어서 자동으로 빌드·배포해요.
# - 백엔드 주소(VITE_API_BASE)는 비밀값은 아니지만 .env가 커밋되지 않으므로
#   Netlify 사이트 설정 → Environment variables 에 따로 넣어야 해요.

[build]
  command = "npm run build"   # Vite로 배포용 파일 만들기
  publish = "dist"            # 만들어진 파일이 들어가는 폴더

[build.environment]
  NODE_VERSION = "22"         # Vite 8은 Node 20.19 이상 또는 22.12 이상이 필요해요
