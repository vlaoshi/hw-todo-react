<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <title>다마고치 투두</title>

    <!-- 브라우저 탭 아이콘: 앱 아이콘과 같은 픽셀 알 -->
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />

    <!-- 앱 설치(PWA): 폰 홈 화면에 추가하면 주소창 없이 앱처럼 열려요 -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#ffd6e5" />
    <!-- 아이폰: 홈 화면 아이콘과 앱처럼 열기 설정 -->
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="TAMA-DO" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />

    <!-- 구글 폰트: 귀여운 한글 폰트(Jua) + 레트로 숫자 폰트(Press Start 2P) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Jua&family=Press+Start+2P&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
